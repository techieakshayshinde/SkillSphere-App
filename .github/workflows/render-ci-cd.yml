name: CI/CD for React + JSON Server (Concurrently)
on:
  push:
    branches: [ main ]

jobs:
    ci:
        name: CI - Validate App
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test
            
            - name: Build React App (vite)
              run: npm run build
    cd: 
        name: CD - Deploy App To Render
        runs-on: ubuntu-latest
        needs: ci
        steps:
            - name: Trigger deployment on Render
              run: |
                curl -X POST \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -d '{"source": "github-actions"}' \
                  https://api.render.com/deploy/sync/v1/your-webhook-url-here